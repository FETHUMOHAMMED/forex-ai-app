version: "3.8"

services:
  v3-api:
    build: .
    command: python ai-service/v3_dashboard_api.py
    ports:
      - "8002:8002"
    volumes:
      - ./ai-service:/app/ai-service:ro
      - v3-api-logs:/app/logs
    environment:
      - FOREX_API_KEY=${FOREX_API_KEY}
      - MT5_PASSWORD=${MT5_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/v3/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    image: node:18
    working_dir: /app/backend
    command: node server.js
    ports:
      - "3001:3001"
      - "8080:8080"
    volumes:
      - ./backend:/app/backend:ro
      - ./ai-service:/app/ai-service:ro
      - backend-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      v3-api:
        condition: service_healthy

  frontend:
    image: node:18
    working_dir: /app/frontend
    command: npm start
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend:ro
      - frontend-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

volumes:
  v3-api-logs:
  backend-logs:
  frontend-logs:
