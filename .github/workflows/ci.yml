name: FOREX-AI-APP CI

on:
  push:
    branches: [ main, master, architecture-refactor-v1 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest MetaTrader5 fastapi uvicorn
      
      - name:       - name: Security scan (dependencies)
        run: |
          pip install pip-audit
          pip-audit
      
      - name: Security scan (secrets)
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline
      
      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short
      
      - name: Run security audit
        run: |
          python tools/security_audit.py || true

