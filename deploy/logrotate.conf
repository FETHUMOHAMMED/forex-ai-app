# Log rotation for FOREX-AI-APP
# Applied to deploy/logs/

deploy/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 user user
    sharedscripts
    postrotate
        echo "Log rotated at $(date)" >> deploy/logs/rotation.log
    endscript
}
